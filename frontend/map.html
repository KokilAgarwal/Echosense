<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geospatial Map | EchoSense</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        #anomalyMap { width: 100%; height: 600px; border-radius: 12px; z-index: 1; }
        .leaflet-popup-content-wrapper { background: var(--bg-card); color: #fff; border: 1px solid var(--border-subtle); backdrop-filter: blur(10px); }
        .leaflet-popup-tip { background: var(--bg-card); }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><a href="index.html" class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> EchoSense</a></div>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Main Dashboard</a>
                <a href="data-studio.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Data Studio</a>
                <a href="analytics.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg> Analytics</a>
                <a href="map.html" class="nav-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg> Map Visualization</a>
                <a href="reports.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> Reports</a>
            </nav>
            <a href="profile.html" style="text-decoration: none;"><div class="user-profile"><div class="avatar">DA</div><div><h4 style="font-size: 14px; color: #fff;">Dr. Alice</h4></div></div></a>
        </aside>

        <main class="main-content" style="padding-right: 0;">
            <div class="topbar" style="padding-right: 2rem;">
                <div>
                    <h2 class="mb-1">Global Degradation Heatmap</h2>
                    <p class="text-muted">Interactive spatial visualization of Silence Scores</p>
                </div>
            </div>

            <div style="padding-right: 2rem; position: relative;">
                <div class="glass-panel" style="padding: 10px;">
                    <div id="anomalyMap"></div>
                    
                    <!-- Legend -->
                    <div style="position: absolute; bottom: 30px; right: 50px; background: rgba(15,23,20,0.9); padding: 15px; border-radius: 8px; z-index: 1000; border: 1px solid var(--border-subtle);">
                        <h4 class="mb-2" style="font-size: 12px; color: var(--text-muted)">SILENCE SCORE / STATUS</h4>
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 5px;">
                            <div style="width: 15px; height: 15px; background: rgba(16, 185, 129, 0.6); border: 1px solid #10b981;"></div> <span style="font-size: 12px;">Healthy (0-30%)</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 5px;">
                            <div style="width: 15px; height: 15px; background: rgba(245, 158, 11, 0.6); border: 1px solid #f59e0b;"></div> <span style="font-size: 12px;">Stress (31-70%)</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div style="width: 15px; height: 15px; background: rgba(239, 68, 68, 0.6); border: 1px solid #ef4444;"></div> <span style="font-size: 12px;">Critical (71-100%)</span>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
