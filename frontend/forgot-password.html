<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EchoSense</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .auth-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.1) 0%, var(--bg-dark) 50%); padding: 2rem; }
        .auth-card { max-width: 450px; width: 100%; padding: 3rem 2.5rem; }
        .auth-header { text-align: center; margin-bottom: 2.5rem; }
        .auth-logo { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--primary-emerald); display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.875rem; }
        .form-control { width: 100%; padding: 0.75rem 1rem; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-subtle); border-radius: 8px; color: #fff; transition: var(--transition-smooth); font-family: 'Inter', sans-serif; }
        .form-control:focus { outline: none; border-color: var(--primary-emerald); background: rgba(16, 185, 129, 0.05); }
        .btn-block { width: 100%; display: block; }
        .auth-footer { text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.875rem; }
        .auth-footer a { color: var(--primary-emerald); text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="glass-panel auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    EchoSense
                </div>
                <p class="text-muted">Password Recovery</p>
            </div>
            
            <p class="text-muted text-sm text-center mb-4">Enter your email address and we'll send you a link to reset your password securely.</p>
            
            <form onsubmit="event.preventDefault(); alert('Reset link simulated!'); window.location.href='login.html';">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block mb-3">Send Recovery Link</button>
                <button type="button" class="btn btn-outline btn-block" onclick="window.location.href='login.html'">Back to Login</button>
            </form>
        </div>
    </div>
</body>
</html>
